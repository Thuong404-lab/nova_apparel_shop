# ==============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ==============================================================================
spring.application.name=NovaApparel
server.port=8080

# 1. DATABASE CONFIGURATION (MYSQL 8.0+)
spring.datasource.url=jdbc:mysql://localhost:3306/NovaApparelDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# 3. JWT SECURITY CONFIGURATION
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# 4. SWAGGER / OPENAPI UI CONFIGURATION
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# 5. SERVER & ENCODING
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
